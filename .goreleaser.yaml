version: 2

project_name: immich-backup

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/daksh7011/immich-backup/cmd.Version={{.Version}}
    main: ./main.go

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: immich-backup
    repository:
      owner: daksh7011
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/daksh7011/immich-backup"
    description: "Go CLI tool for backing up Immich (self-hosted photo server) using rclone."
    license: MIT
    install: |
      bin.install "immich-backup"
    caveats: |
      To schedule daily backups, run as your own user (not with sudo):
        immich-backup setup
        immich-backup daemon install
      After every `brew upgrade immich-backup`, re-run `immich-backup daemon install`
      so the background service picks up the new version, then check it with
      `immich-backup daemon status`.
      Linux: scheduled runs need lingering. `daemon install` turns it on; if it
      reports that it could not, run:
        sudo loginctl enable-linger $USER
      macOS: the job runs only while you are logged in to the desktop. If your Immich
      library is on an external or protected volume, grant Full Disk Access to the
      binary the service runs (`immich-backup doctor` shows the path) and re-grant
      it after upgrades.
    test: |
      system "#{bin}/immich-backup", "--help"
